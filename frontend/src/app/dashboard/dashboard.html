<div class="container">
  <h2>Delivery Dashboard</h2>
  
  <app-delivery-form (deliveryCreated)="loadDeliveries()"></app-delivery-form>

  <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

  <div class="cards-grid">
    <div *ngFor="let item of deliveries()" class="card" [ngClass]="item.status">
      
      <div class="card-header">
        <span class="tracking">{{ item.tracking_code }}</span>
        <span class="badge" [class.high-priority]="item.priority === 'HIGH'">
          {{ item.priority }}
        </span>
      </div>

      <div class="card-body">
        <h3>{{ item.recipient_name }}</h3>
        <p>{{ item.address }}</p>
        <p class="time-slot" *ngIf="item.time_slot">🕒 {{ item.time_slot }}</p>
      </div>

      <div class="card-footer">
        <p>Status: <strong>{{ item.status }}</strong></p>
        
        <div class="actions">
          <button *ngIf="item.status === 'READY'" 
                  (click)="updateStatus(item.id, 'OUT_FOR_DELIVERY')" 
                  class="btn-go">
            Partenza 🚚
          </button>

          <ng-container *ngIf="item.status === 'OUT_FOR_DELIVERY'">
            <button (click)="updateStatus(item.id, 'DELIVERED')" class="btn-ok">Consegnato ✅</button>
            <button (click)="updateStatus(item.id, 'FAILED')" class="btn-ko">Fallito ❌</button>
          </ng-container>
        </div>
      </div>
      </div>
  </div>
</div>
